name: Build Firmware & Deploy Web Flasher

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Optional version label (defaults to CMake PROJECT_VER)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.4
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore TLS private key from repository secret
        env:
          STADIA_PRIVKEY_B64: ${{ secrets.STADIA_PRIVKEY_B64 }}
        run: |
          if [ -z "$STADIA_PRIVKEY_B64" ]; then
            echo "::error::Missing repository secret STADIA_PRIVKEY_B64 (base64-encoded main/certs/privkey.pem)."
            exit 1
          fi
          printf '%s' "$STADIA_PRIVKEY_B64" | base64 -d > main/certs/privkey.pem

      - name: Build all ESP32-S3 board variants (8MB OPI, 4MB+ Quad PSRAM, 4MB+ No-PSRAM)
        id: meta
        run: |
          . /opt/esp/idf/export.sh
          mkdir -p _site/firmware

          VER="${{ github.event.inputs.version_override }}"
          if [ -z "$VER" ]; then
            if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
              VER="${GITHUB_REF_NAME#v}"
            else
              VER=$(sed -n 's/^set(PROJECT_VER "\([^"]*\)")/\1/p' CMakeLists.txt)
            fi
          fi
          VER="${VER:-dev}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

          # 1. Default Target: 8MB Flash + 8MB Octal (OPI) PSRAM (XIAO ESP32-S3, DevKitC-1 N8R8/N16R8)
          rm -rf build sdkconfig
          idf.py -B build_octal -DSDKCONFIG_DEFAULTS="sdkconfig.defaults" set-target esp32s3
          idf.py -B build_octal build
          python -m esptool --chip esp32s3 merge_bin \
            -o _site/firmware/stadiacast-esp32-merged.bin \
            --flash_mode dio --flash_freq 80m --flash_size 8MB \
            0x0 build_octal/bootloader/bootloader.bin \
            0x8000 build_octal/partition_table/partition-table.bin \
            0xf000 build_octal/ota_data_initial.bin \
            0x20000 build_octal/stadiacast-esp32.bin
          cp build_octal/stadiacast-esp32.bin _site/firmware/stadiacast-esp32.bin
          rm -rf build_octal sdkconfig

          # 2. Quad PSRAM Target: 4MB+ Flash + 2MB Quad PSRAM (S3-Zero, S3-SuperMini, Lolin S3 Mini, S3-GEEK, QT Py S3)
          idf.py -B build_quad -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.quad" set-target esp32s3
          idf.py -B build_quad build
          python -m esptool --chip esp32s3 merge_bin \
            -o _site/firmware/stadiacast-esp32-s3-quad-merged.bin \
            --flash_mode dio --flash_freq 80m --flash_size 4MB \
            0x0 build_quad/bootloader/bootloader.bin \
            0x8000 build_quad/partition_table/partition-table.bin \
            0xf000 build_quad/ota_data_initial.bin \
            0x20000 build_quad/stadiacast-esp32.bin
          cp build_quad/stadiacast-esp32.bin _site/firmware/stadiacast-esp32-s3-quad.bin
          rm -rf build_quad sdkconfig

          # 3. No-PSRAM Target: 4MB+ Flash + 512KB Internal SRAM (T-Dongle-S3, M5Stack AtomS3U, StampS3)
          idf.py -B build_nopsram -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.nopsram" set-target esp32s3
          idf.py -B build_nopsram build
          python -m esptool --chip esp32s3 merge_bin \
            -o _site/firmware/stadiacast-esp32-s3-nopsram-merged.bin \
            --flash_mode dio --flash_freq 80m --flash_size 4MB \
            0x0 build_nopsram/bootloader/bootloader.bin \
            0x8000 build_nopsram/partition_table/partition-table.bin \
            0xf000 build_nopsram/ota_data_initial.bin \
            0x20000 build_nopsram/stadiacast-esp32.bin
          cp build_nopsram/stadiacast-esp32.bin _site/firmware/stadiacast-esp32-s3-nopsram.bin
          rm -rf build_nopsram sdkconfig

          cp web/index.html _site/index.html

          SHA256_MERGED=$(sha256sum _site/firmware/stadiacast-esp32-merged.bin | awk '{print $1}')
          SHA256_APP=$(sha256sum _site/firmware/stadiacast-esp32.bin | awk '{print $1}')
          SHA256_QUAD_MERGED=$(sha256sum _site/firmware/stadiacast-esp32-s3-quad-merged.bin | awk '{print $1}')
          SHA256_NOPSRAM_MERGED=$(sha256sum _site/firmware/stadiacast-esp32-s3-nopsram-merged.bin | awk '{print $1}')
          BUILT_AT=$(date -u +"%Y-%m-%d %H:%M UTC")

          cat > _site/manifest.json <<EOF
          {
            "name": "Stadia Wireless Adapter (XIAO ESP32-S3 / 8MB OPI)",
            "version": "v${VER}",
            "new_install_prompt_erase": false,
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  { "path": "firmware/stadiacast-esp32-merged.bin", "offset": 0 }
                ]
              }
            ]
          }
          EOF

          cat > _site/manifest-s3-quad.json <<EOF
          {
            "name": "Stadia Wireless Adapter (ESP32-S3 4MB + 2MB Quad PSRAM)",
            "version": "v${VER}",
            "new_install_prompt_erase": false,
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  { "path": "firmware/stadiacast-esp32-s3-quad-merged.bin", "offset": 0 }
                ]
              }
            ]
          }
          EOF

          cat > _site/manifest-s3-nopsram.json <<EOF
          {
            "name": "Stadia Wireless Adapter (ESP32-S3 No-PSRAM)",
            "version": "v${VER}",
            "new_install_prompt_erase": false,
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  { "path": "firmware/stadiacast-esp32-s3-nopsram-merged.bin", "offset": 0 }
                ]
              }
            ]
          }
          EOF

          cat > _site/version.json <<EOF
          {
            "version": "v${VER}",
            "sha": "${GITHUB_SHA}",
            "built_at": "${BUILT_AT}",
            "sha256_merged": "${SHA256_MERGED}",
            "sha256_app": "${SHA256_APP}",
            "sha256_quad_merged": "${SHA256_QUAD_MERGED}",
            "sha256_nopsram_merged": "${SHA256_NOPSRAM_MERGED}"
          }
          EOF

          (cd _site/firmware && sha256sum *.bin > SHA256SUMS.txt)

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stadiacast-esp32-firmware
          path: _site/firmware/*

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download built firmware
        uses: actions/download-artifact@v4
        with:
          name: stadiacast-esp32-firmware
          path: dist

      - name: Attach firmware to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          REPO="${{ github.repository }}"
          cp dist/stadiacast-esp32-merged.bin "stadiacast-esp32-${TAG}-merged.bin"
          cp dist/stadiacast-esp32.bin "stadiacast-esp32.bin"
          cp dist/stadiacast-esp32-s3-quad-merged.bin "stadiacast-esp32-s3-quad-${TAG}-merged.bin"
          cp dist/stadiacast-esp32-s3-quad.bin "stadiacast-esp32-s3-quad.bin"
          cp dist/stadiacast-esp32-s3-nopsram-merged.bin "stadiacast-esp32-s3-nopsram-${TAG}-merged.bin"
          cp dist/stadiacast-esp32-s3-nopsram.bin "stadiacast-esp32-s3-nopsram.bin"
          sha256sum *.bin > SHA256SUMS.txt
          ASSETS=(
            "stadiacast-esp32-${TAG}-merged.bin"
            "stadiacast-esp32.bin"
            "stadiacast-esp32-s3-quad-${TAG}-merged.bin"
            "stadiacast-esp32-s3-quad.bin"
            "stadiacast-esp32-s3-nopsram-${TAG}-merged.bin"
            "stadiacast-esp32-s3-nopsram.bin"
            "SHA256SUMS.txt"
          )
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" -R "$REPO" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" -R "$REPO" "${ASSETS[@]}" \
              --title "${TAG}" --generate-notes
          fi
